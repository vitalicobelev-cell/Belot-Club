<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Belot Club</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="topbar">

        <button
            id="menuBtn"
            class="icon-btn">

            ☰

        </button>

        <h1 class="logo">

            ♠ BELOT CLUB ♣

        </h1>

        <button
            id="rulesBtn"
            class="icon-btn">

            📖

        </button>

    </header>



    <!-- ======================================
         INFO BAR
    ======================================= -->

    <section class="info-bar">

        <div
            id="dealCounter"
            class="deal-counter">

            №1

        </div>

        <div
            id="gameTimer"
            class="timer">

            00:00:00

        </div>

        <div class="info-right">

            &nbsp;

        </div>

    </section>



    <!-- ======================================
         SCORE PANEL (CLICK = HISTORY)
    ======================================= -->

    <section
        id="scorePanel"
        class="score-panel">

        <div class="teams">

            <!-- TEAM 1 -->

            <div class="team">

                <div class="team-title">

                    Команда 1

                </div>

                <div
                    id="team1Players"
                    class="team-players">

                    <div>Игрок 1</div>

                    <div>Игрок 2</div>

                </div>

                <div class="team-footer">

                    <div
                        id="team1Score"
                        class="team-score">

                        0

                    </div>

                    <div
                        id="team1Bolts"
                        class="team-bolts">

                        ⚡0

                    </div>

                </div>

            </div>



            <!-- TEAM 2 -->

            <div class="team">

                <div class="team-title">

                    Команда 2

                </div>

                <div
                    id="team2Players"
                    class="team-players">

                    <div>Игрок 3</div>

                    <div>Игрок 4</div>

                </div>

                <div class="team-footer">

                    <div
                        id="team2Bolts"
                        class="team-bolts">

                        ⚡0

                    </div>

                    <div
                        id="team2Score"
                        class="team-score">

                        0

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ======================================
         CURRENT DEAL
    ======================================= -->

    <main class="game-panel">

        <!-- Dealer -->

        <div class="row">

            <div class="row-label">

                🃏 Сдает

            </div>

            <div
                id="dealerName"
                class="row-value">

                Виталий

            </div>

        </div>



        <!-- Current player -->

        <div class="row">

            <div class="row-label">

                🂠 Играет

            </div>

            <select
                id="currentPlayer"
                class="select">

                <!-- Заполняется автоматически -->
            </select>

        </div>



        <!-- Game value -->

        <div class="game-cost">

            <div
                id="gameCost"
                class="cost-badge">

                🟠 16

            </div>

            <button
                id="declareBtn"
                class="declare-btn">

                📢 (0)

            </button>

        </div>



        <!-- Opponents -->

        <div class="row">

            <label
                class="row-label"
                for="enemyPoints">

                Очки соперника

            </label>

            <input
                id="enemyPoints"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="0">

        </div>



        <!-- Player -->

        <div class="row">

            <label
                class="row-label"
                for="playerPoints">

                🂠 Играющему

            </label>

            <input
                id="playerPoints"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="0">

        </div>



        <!-- Save -->

        <div class="save-section">

            <button
                id="saveBtn"
                class="save-btn">

                💾 Сохранить

            </button>

        </div>

    </main>

    <!-- ======================================
         DECLARATIONS MODAL
    ======================================= -->

    <div
        id="declareModal"
        class="modal hidden">

        <div class="modal-window">

            <div class="modal-header">

                <h2>📢 Объявы</h2>

                <button
                    id="closeDeclare"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="declareList"
                class="declare-content">

                <!-- Заполняется JavaScript -->

            </div>

            <button
                id="saveDeclare"
                class="modal-save">

                ✔ Применить

            </button>

        </div>

    </div>



    <!-- ======================================
         CONFIRM MODAL
    ======================================= -->

    <div
        id="confirmModal"
        class="modal hidden">

        <div class="modal-window">

            <div class="modal-header">

                <h2>Проверка</h2>

            </div>

            <div
                id="confirmContent"
                class="confirm-body">

                <!-- JavaScript формирует сообщение -->

            </div>

            <div class="modal-buttons">

                <button
                    id="cancelSave"
                    class="secondary-btn">

                    ← Отмена

                </button>

                <button
                    id="confirmSave"
                    class="primary-btn">

                    ✔ Подтвердить

                </button>

            </div>

        </div>

    </div>



    <!-- ======================================
         RULES MODAL
    ======================================= -->

    <div
        id="rulesModal"
        class="modal hidden">

        <div class="modal-window modal-large">

            <div class="modal-header">

                <h2>📖 Правила</h2>

                <button
                    id="closeRules"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="rulesContent"
                class="rules-content">

                <!-- Правила будут добавлены позже -->

            </div>

        </div>

    </div>






        <!-- ======================================
         HISTORY MODAL
    ======================================= -->

    <div
        id="historyModal"
        class="modal hidden">

        <div class="modal-window modal-large">

            <div class="modal-header">

                <h2>История партии</h2>

                <button
                    id="closeHistory"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="historyContent"
                class="history-content">

                <!-- История сдач -->

            </div>

        </div>

    </div>



    <!-- ======================================
         TOAST
    ======================================= -->

    <div
        id="toast"
        class="toast hidden">

        ✔ Сохранено

    </div>

</div>



<!-- ======================================
     SCRIPT
====================================== -->

<script src="script.js"></script>

</body>
</html>
