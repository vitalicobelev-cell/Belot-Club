<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Belot Club</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- ==========================
         HEADER
    =========================== -->

    <header class="topbar">

        <button id="menuBtn" class="icon-btn">
            ☰
        </button>

        <h1 class="logo">
            ♠ BELOT CLUB ♣
        </h1>

        <button id="rulesBtn" class="icon-btn">
            📖
        </button>

    </header>



    <!-- ==========================
         TIMER
    =========================== -->

    <section class="timer">

        <span id="gameTimer">
            ⏱ 00:00:00
        </span>

    </section>



    <!-- ==========================
         HISTORY BUTTON
    =========================== -->

    <section class="history">

        <button id="historyBtn" class="history-btn">

            <span>
                📜 История
            </span>

            <span>
                ❯
            </span>

        </button>

    </section>



    <!-- ==========================
         TEAMS
    =========================== -->

    <section class="teams">

        <!-- TEAM 1 -->

        <article class="team" id="team1">

            <div class="team-title">

                Команда 1

            </div>

            <div class="team-players">

                <div id="team1Player1">
                    Виталий
                </div>

                <div id="team1Player2">
                    Сережа
                </div>

            </div>

            <div class="team-footer">

                <div
                    class="team-score"
                    id="team1Score">

                    0

                </div>

                <div
                    class="team-bolts"
                    id="team1Bolts">

                    ⚡⚡

                </div>

            </div>

        </article>



        <!-- TEAM 2 -->

        <article class="team" id="team2">

            <div class="team-title">

                Команда 2

            </div>

            <div class="team-players">

                <div id="team2Player1">
                    Анастасия
                </div>

                <div id="team2Player2">
                    Алина
                </div>

            </div>

            <div class="team-footer">

                <div
                    class="team-score"
                    id="team2Score">

                    0

                </div>

                <div
                    class="team-bolts"
                    id="team2Bolts">

                    ⚡

                </div>

            </div>

        </article>

    </section>


    <!-- ==========================
         DEALER
    =========================== -->

    <section class="row">

        <div class="row-label">

           🃏 Сдает

        </div>

        <div
            id="dealerName"
            class="row-value">

            Виталий

        </div>

    </section>



    <!-- ==========================
         CURRENT PLAYER
    =========================== -->

    <section class="row">

        <label
            class="row-label"
            for="currentPlayer">

            🂠 Играет

        </label>


        <select id="currentPlayer" class="select">
    <option>Виталий</option>
    <option>Сергей</option>
    <option>Анастасия</option>
    <option>Алина</option>
</select>
        

    </section>



    <!-- ==========================
         GAME COST
    =========================== -->

    <section class="row">

        <div class="game-cost">

            <div
                id="gameCost"
                class="cost-badge">

                🟡 16

            </div>

            <button
                id="declarationsBtn"
                class="declare-btn">

                📢 (0)

            </button>

        </div>

    </section>



    <!-- ==========================
         ENEMY SCORE
    =========================== -->

    <section class="row">

        <label
            class="row-label"
            for="enemyScore">

            Очки соперника

        </label>

        <input
            id="enemyScore"
            type="number"
            inputmode="numeric"
            min="0"
            max="162"
            placeholder="0">

    </section>



    <!-- ==========================
         PLAYER SCORE
    =========================== -->

    <section class="row">

        <label
            class="row-label"
            for="playerScore">

            🂠 Играющему

        </label>

        <input
            id="playerScore"
            type="number"
            inputmode="numeric"
            min="0"
            max="162"
            placeholder="0">

    </section>

    <!-- ==========================
         GAME EVENTS
    =========================== -->

    <section class="events">

        <button
            id="boltBtn"
            class="event-btn">

            ⚡ Болт

        </button>

        <button
            id="wrongDealBtn"
            class="event-btn">

            ❌ Раздача

        </button>

        <button
            id="noTrickBtn"
            class="event-btn">

            🚫 Нет взятки

        </button>

    </section>



    <!-- ==========================
         SAVE
    =========================== -->

    <section class="save-section">

        <button
            id="saveBtn"
            class="save-btn">

            💾 СОХРАНИТЬ СДАЧУ

        </button>

    </section>



    <!-- ==========================
         HISTORY MODAL
    =========================== -->

    <div
        id="historyModal"
        class="modal hidden">

        <div class="modal-window">

            <div class="modal-header">

                <h2>
                    📜 История партии
                </h2>

                <button
                    id="closeHistoryBtn"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="historyTable"
                class="history-table">

                <!-- История сдач -->

            </div>

        </div>

    </div>



    <!-- ==========================
         DECLARATIONS MODAL
    =========================== -->

    <div
        id="declareModal"
        class="modal hidden">

        <div class="modal-window">

            <div class="modal-header">

                <h2>
                    📢 Объявления
                </h2>

                <button
                    id="closeDeclareBtn"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="declareContent"
                class="declare-content">

                <!-- Здесь будут объявления -->

            </div>

            <button
                id="saveDeclarationsBtn"
                class="modal-save">

                ✔ Сохранить

            </button>

        </div>

    </div>

    
    <!-- ==========================
         SAVE CONFIRM MODAL
    =========================== -->

    <div
        id="confirmModal"
        class="modal hidden">

        <div class="modal-window">

            <div class="modal-header">

                <h2>
                    Проверка сдачи
                </h2>

            </div>

            <div class="confirm-body">

                <div class="confirm-row">

                    <span>Играет</span>

                    <strong id="confirmPlayer">
                        —
                    </strong>

                </div>

                <div class="confirm-row">

                    <span>Стоимость</span>

                    <strong id="confirmCost">
                        🪙 16
                    </strong>

                </div>

                <div class="confirm-row">

                    <span>Объявления</span>

                    <strong id="confirmDeclarations">
                        📢 (0)
                    </strong>

                </div>

                <div class="confirm-row">

                    <span>Очки соперника</span>

                    <strong id="confirmEnemyScore">
                        0
                    </strong>

                </div>

                <div class="confirm-row">

                    <span>Играющему</span>

                    <strong id="confirmPlayerScore">
                        0
                    </strong>

                </div>

            </div>

            <div class="modal-buttons">

                <button
                    id="editGameBtn"
                    class="secondary-btn">

                    ← Изменить

                </button>

                <button
                    id="confirmSaveBtn"
                    class="primary-btn">

                    ✔ Сохранить

                </button>

            </div>

        </div>

    </div>



    <!-- ==========================
         RULES MODAL
    =========================== -->

    <div
        id="rulesModal"
        class="modal hidden">

        <div class="modal-window modal-large">

            <div class="modal-header">

                <h2>
                    📖 Правила
                </h2>

                <button
                    id="closeRulesBtn"
                    class="close-btn">

                    ✕

                </button>

            </div>

            <div
                id="rulesContent"
                class="rules-content">

            </div>

        </div>

    </div>

    
    <!-- ==========================
         TOAST
    =========================== -->

    <div
        id="toast"
        class="toast hidden">

        ✅ Сохранено

    </div>

</div>
<!-- END APP -->



<!-- ==========================
     SCRIPTS
========================== -->

<script src="js/script.js"></script>

</body>
</html>
