<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Belot Club</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>




<!-- ======================================
     START SCREEN
====================================== -->

<div id="startScreen" class="start-screen">

    <div class="start-window">

        <h1 class="logo">

            Belot Club

        </h1>

        <button
            class="mode-btn"
            data-mode="2">

            2 игрока

        </button>

        <button
            class="mode-btn"
            data-mode="3">

            3 игрока

        </button>

        <button
            class="mode-btn"
            data-mode="4">

            4 игрока

        </button>

    </div>

</div>



<!-- ======================================
     CONTINUE SCREEN
====================================== -->

<div
    id="continueScreen"
    class="start-screen hidden">

    <div class="start-window">

        <button
            id="backToModes"
            class="back-btn">

            ← Назад

        </button>

        <h2>

            Найдена сохранённая партия

        </h2>

        <button
            id="continueGame"
            class="mode-btn">

            Продолжить игру

        </button>

        <button
            id="newGame"
            class="mode-btn">

            Новая игра

        </button>

    </div>

</div>




<!-- ======================================
     REGISTER
====================================== -->

<div
    id="registerScreen"
    class="start-screen hidden">

    <div class="start-window">

        <button
            id="backToContinue"
            class="back-btn">

            ← Назад

        </button>

        <h2>

            Игроки

        </h2>

        <div
            id="rowPlayer1"
            class="player-row">

            <input

                id="player1"

                class="player-input"

                placeholder="Игрок №1">

            <div

                id="player1List"

                class="player-list hidden">

            </div>

        </div>



        <div

            id="rowPlayer2"

            class="player-row">

            <input

                id="player2"

                class="player-input"

                placeholder="Игрок №2">

            <div

                id="player2List"

                class="player-list hidden">

            </div>

        </div>



        <div

            id="rowPlayer3"

            class="player-row">

            <input

                id="player3"

                class="player-input"

                placeholder="Игрок №3">

            <div

                id="player3List"

                class="player-list hidden">

            </div>

        </div>



        <div

            id="rowPlayer4"

            class="player-row">

            <input

                id="player4"

                class="player-input"

                placeholder="Игрок №4">

            <div

                id="player4List"

                class="player-list hidden">

            </div>

        </div>



        <button

            id="startGame"

            class="mode-btn">

            Начать игру

        </button>

    </div>

</div>




    <!-- ======================================
     GAME SCREEN
====================================== -->

<div
    id="gameScreen"
    class="game-screen hidden">

    <!-- Верхняя строка -->

    <div class="top-bar">

        <div id="dealCounter">

            №1

        </div>

        <div id="timerLabel">

            00:00

        </div>

        <div class="top-right">

        </div>

    </div>



    <!-- Команды -->

    <div class="teams-wrap">

        <div
            class="team-card"
            id="team1Card">

            <div
                id="team1Name"
                class="team-name">

                Команда 1

            </div>

            <div
                id="team1Score"
                class="team-score">

                0

            </div>

            <div
                id="team1Bolts"
                class="team-bolts">

                ⚡0

            </div>

        </div>



        <div
            class="team-card"
            id="team2Card">

            <div
                id="team2Name"
                class="team-name">

                Команда 2

            </div>

            <div
                id="team2Score"
                class="team-score">

                0

            </div>

            <div
                id="team2Bolts"
                class="team-bolts">

                ⚡0

            </div>

        </div>

    </div>

    <!-- Информация -->

    <div class="game-info">

        <div class="info-row">

            <span>

                🃏 Сдаёт

            </span>

            <span id="dealerName">

                —

            </span>

        </div>



        <div class="info-row">

            <span>

                ▶ Играет

            </span>

            <span id="currentPlayerName">

                —

            </span>

        </div>



        <div class="info-row">

            <span>

                🟠 Игра

            </span>

            <span id="gameValue">

                16

            </span>

        </div>

    </div>

    <!-- Очки -->

    <div class="score-panel">

        <input

            id="playerPoints"

            type="number"

            placeholder="Играющий">

        <input

            id="enemyPoints"

            type="number"

            placeholder="Соперник">

    </div>



    <!-- Кнопка -->

    <button

        id="saveButton"

        class="save-btn">

        Сохранить игру

    </button>
    
    




    <!-- ======================================
     HISTORY
====================================== -->

<div
    id="historyScreen"
    class="start-screen hidden">

    <div class="history-window">

        <button
            id="closeHistory"
            class="back-btn">

            ← Назад

        </button>

        <h2>

            История партии

        </h2>

        <div class="history-table">

            <table>

                <thead>

                    <tr>

                        <th>Раздача</th>
                        <th>🟠</th>
                        <th>Событие</th>
                        <th>Команда 1</th>
                        <th>Команда 2</th>
                        <th>Сдавал</th>
                        <th>Играл</th>

                    </tr>

                </thead>

                <tbody id="historyBody">

                </tbody>

            </table>

        </div>

    </div>

</div>



    <!-- ======================================
     INFO
====================================== -->

<div
    id="infoModal"
    class="modal hidden">

    <div class="modal-window">

        <div
            id="infoText"
            class="modal-text">

        </div>

        <button
            id="infoOk"
            class="mode-btn">

            OK

        </button>

    </div>

</div>


<!-- ======================================
     CONFIRM
====================================== -->

<div
    id="confirmModal"
    class="modal hidden">

    <div class="modal-window">

        <div
            id="confirmText"
            class="modal-text">

        </div>

        <div class="confirm-buttons">

            <button
                id="confirmCancel"
                class="mode-btn">

                Отмена

            </button>

            <button
                id="confirmOk"
                class="mode-btn">

                Записать

            </button>

        </div>

    </div>

</div>


    <!-- ======================================
     GAME OVER
====================================== -->

<div
    id="finishModal"
    class="modal hidden">

    <div class="modal-window">

        <h2>

            Партия завершена

        </h2>

        <div
            id="winnerText"
            class="modal-text">

        </div>

        <button
            id="finishOk"
            class="mode-btn">

            Новая игра

        </button>

    </div>

</div>


    
    



  
<!-- ======================================
     LOADING
====================================== -->

<div
    id="loadingScreen"
    class="loading-screen hidden">

    <div class="loading-box">

        <div class="loading-spinner">

        </div>

        <div class="loading-text">

            Загрузка...

        </div>

    </div>

</div>



<!-- ======================================
     OVERLAY
====================================== -->

<div
    id="overlay"
    class="overlay hidden">

</div>



<!-- ======================================
     ANIMATION LAYER
====================================== -->

<div
    id="animationLayer">

</div>
    
<!-- ======================================
     SCRIPT
====================================== -->

<script src="script.js"></script>

</body>
</html>
