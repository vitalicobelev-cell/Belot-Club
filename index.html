<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Belot Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
  <div id="menu" class="screen active">
    <h1>♣ Belot Club ♣</h1>
    <div class="button-group">
      <button onclick="startGame()" class="btn-primary">Начать игру</button>
      <button onclick="continueGame()" class="btn-primary">Продолжить игру</button>
      <button onclick="showRules()" class="btn-secondary">Правила</button>
    </div>
  </div>

  <!-- ЭКРАН 2: ВЫБОР РЕЖИМА -->
  <div id="mode" class="screen">
    <h1>Выберите режим</h1>
    <div class="button-group">
      <button onclick="setMode(2)" class="btn-primary">2 игрока</button>
      <button onclick="setMode(3)" class="btn-primary">3 игрока</button>
      <button onclick="setMode(4)" class="btn-primary">4 игрока</button>
      <button onclick="goBackToMenu()" class="btn-secondary">Назад</button>
    </div>
  </div>

  <!-- ЭКРАН 3: ВВОД ИМЁН ИГРОКОВ -->
  <div id="players" class="screen">
    <h1>Введите имена игроков</h1>
    <div id="playerInputs" class="inputs-container">
      <!-- Генерируется динамически -->
    </div>
    <div class="button-group">
      <button onclick="confirmPlayers()" class="btn-primary">Начать игру</button>
      <button onclick="goBackToMode()" class="btn-secondary">Назад</button>
    </div>
  </div>

  <!-- ЭКРАН 4: ИГРОВОЙ ЭКРАН -->
  <div id="game" class="screen">
    <h1>♣ Belot Club ♣</h1>
    
    <!-- Верхняя панель -->
    <div class="top-panel">
      <button onclick="goHome()" class="btn-small">Домой</button>
      <div id="roundInfo">
        <span id="roundNumber">Раздача: 1</span> | 
        <span id="timer" onclick="toggleTimer()" style="cursor: pointer;">⏱ 00:00</span>
      </div>
      <button onclick="showRules()" class="btn-small">Правила</button>
    </div>

    <!-- Информационная панель -->
    <div class="info-panel">
      <div class="team-block">
        <h2>Команда 1</h2>
        <p>Очки: <strong id="team1Score">0</strong></p>
        <p>Болты: <strong id="team1Bolts">0</strong></p>
      </div>
      <div class="vs-block">vs</div>
      <div class="team-block">
        <h2>Команда 2</h2>
        <p>Очки: <strong id="team2Score">0</strong></p>
        <p>Болты: <strong id="team2Bolts">0</strong></p>
      </div>
    </div>

    <!-- Стоимость игры -->
    <div class="game-value-panel">
      <p>Стоимость игры: <strong id="gameValue">16</strong> очков</p>
    </div>

    <!-- Ввод очков -->
    <div class="score-input-panel">
      <div class="input-group">
        <label>Очки играющему:</label>
        <input id="playerScore" type="number" min="0" step="1">
      </div>
      <div class="input-group">
        <label>Очки противнику:</label>
        <input id="opponentScore" type="number" min="0" step="1">
      </div>
    </div>

    <!-- Кнопки действия -->
    <div class="button-group">
      <button onclick="validateScores()" class="btn-primary">Зафиксировать раздачу</button>
      <button onclick="showHistory()" class="btn-secondary">История</button>
    </div>
  </div>

  <!-- ЭКРАН 5: ИСТОРИЯ РАЗДАЧ -->
  <div id="history" class="screen">
    <h1>История раздач</h1>
    <div id="historyList" class="history-container">
      <!-- История генерируется динамически -->
    </div>
    <div class="button-group">
      <button onclick="closeHistory()" class="btn-primary">Закрыть</button>
    </div>
  </div>

  <!-- ЭКРАН 6: ЭКРАН ПОБЕДЫ -->
  <div id="victory" class="screen">
    <h1>🏆 Победа! 🏆</h1>
    <div class="victory-emoji">🥇</div>
    <p id="victoryText" class="victory-message">Команда 1 набрала 101+ очко!</p>
    <p id="finalStats" class="final-stats">Итоговая статистика</p>
    <div class="celebration">🎆 🎉 🎇 🎊 🎉 🎆</div>
    <div class="button-group">
      <button onclick="startNewGame()" class="btn-primary">Главное меню</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
